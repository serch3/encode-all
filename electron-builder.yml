appId: com.serch3.encode-all
productName: Encode All
copyright: Copyright (c) 2026 Sergio Mandujano
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!dist{,/**/*}'
  - '!dist-*{,/**/*}'
  - '!coverage{,/**/*}'
  - '!scripts{,/**/*}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,jest.config.ts}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.jest.json}'
asarUnpack:
  - resources/**
win:
  executableName: encode-all
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  minimumSystemVersion: '13.0'
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  extendInfo:
    NSDocumentsFolderUsageDescription: Encode All reads videos and saves encoded files in folders you choose.
    NSDownloadsFolderUsageDescription: Encode All reads videos and saves encoded files in folders you choose.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Sergio Mandujano
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: serch3
  repo: encode-all
